<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emma Bingo! 🎉</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <h1 class="site-title">✨ Emma Bingo ✨</h1>
        <p class="week-info">Week of <span id="week-label"></span></p>
    </header>

    <div class="controls-bar">
        <div class="controls-left">
            <label for="grid-size" class="control-label">Board:</label>
            <select id="grid-size" class="select">
                <option value="3">3×3 (8 phrases)</option>
                <option value="4">4×4 (16 phrases)</option>
                <option value="5" selected>5×5 (24 phrases)</option>
                <option value="6">6×6 (36 phrases)</option>
                <option value="7">7×7 (48 phrases)</option>
            </select>
        </div>
        <div class="controls-right">
            <button id="btn-weekly" class="btn btn-mode active" data-mode="weekly" title="This week's board – same for everyone">📅 Weekly</button>
            <button id="btn-shuffle" class="btn btn-mode" data-mode="custom" title="Generate your own random board">🔀 Shuffle</button>
            <button id="btn-reset" class="btn btn-reset" title="Clear all crossed-off phrases">🔄 Reset</button>
        </div>
    </div>

    <div class="progress-bar-wrap">
        <div id="progress-text" class="progress-text"></div>
        <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </div>

    <main>
        <div class="grid-container">
            <div id="bingo-grid" class="bingo-grid" role="grid" aria-label="Emma Bingo board"></div>
        </div>
    </main>

    <p class="hint">Tap a phrase to cross it off — tap again to undo</p>

    <!-- Hidden Emma image loaded once; used by the EmmaBonkersViz animation.
         emma.png (with transparency) is used for the full photo effect.
         If the image is absent, the animation uses an emoji 👸 avatar fallback. -->
    <img id="emma-img" src="emma.png" aria-hidden="true"
         style="display:none" crossorigin="anonymous"
         onerror="this.removeAttribute('src')">

    <!-- Victory Overlay -->
    <div id="victory-overlay" class="victory-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="victory-heading">
        <!-- Full-screen canvas for the Emma Bonkers animation -->
        <canvas id="confetti-canvas" aria-hidden="true"></canvas>
        <!-- Victory panel — hidden during animation, shown after 60 s -->
        <div class="victory-box" id="victory-box">
            <div class="victory-emoji" aria-hidden="true">🎊</div>
            <h2 id="victory-heading" class="victory-heading">EMMA BINGO!</h2>
            <p id="victory-phrase" class="victory-phrase"></p>
            <button id="btn-close-victory" class="btn btn-victory">🎉 Keep Playing!</button>
        </div>
    </div>

    <script src="emma-bonkers.js"></script>
    <script src="script.js"></script>
</body>
</html>
